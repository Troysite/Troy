<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adopt a Cat - MeanKat Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FDE68A;--purple:#8B7AB8;--ink:#0F0F0F;--cream:#FFFBF8}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:var(--ink);color:white}
.header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#111;border-bottom:3px solid var(--yellow);position:sticky;top:0;z-index:100;flex-wrap:wrap}
.logo{height:50px;background:white;border-radius:12px;padding:5px;border:2px solid var(--yellow);display:block}
.nav{display:flex;align-items:center;gap:18px}.nav a{color:white!important;text-decoration:none!important;font-weight:700;font-size:14px}.nav a.active{color:var(--yellow)!important}
.btn{background:var(--yellow);color:#111!important;padding:9px 16px;border-radius:999px;text-decoration:none!important;font-weight:800;font-size:13px;white-space:nowrap}
.wrap{max-width:600px;margin:0 auto;padding:20px}
.form-wrap{background:var(--cream);color:#111;border-radius:28px;padding:24px 20px;border:3px solid var(--yellow)}
.form-title{font-family:Fredoka;font-size:36px;color:var(--purple)}
label{display:block;font-weight:700;font-size:13px;margin-top:14px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid #E9D5FF;margin-top:6px;font-family:Inter;font-size:14px;background:white}
textarea{height:80px;resize:vertical}
.submit{width:100%;background:#111;color:white;padding:14px;border-radius:999px;border:none;font-weight:800;font-size:15px;margin-top:18px;cursor:pointer}
@media(max-width:650px){.header{padding:10px 12px}.logo{height:44px}.nav{width:100%;order:3;justify-content:space-between;gap:0;margin-top:10px;padding-top:10px;border-top:1px solid #222}.nav a{font-size:13px}.btn{font-size:11px;padding:8px 12px}}
</style>
</head>
<body>
<header class="header"><a href="index.html"><img src="logo-560.webp" class="logo" alt="MeanKat"></a><nav class="nav"><a href="index.html">Home</a><a href="cats.html">Cats</a><a href="menu.html">Menu</a><a href="services.html">Services</a><a class="btn" href="https://wa.me/27772637424">077 263 7424</a></nav></header>
<div class="wrap">
<div class="form-wrap">
<div class="form-title">Adopt a Cat 🐾</div>
<p style="font-size:13px;margin-top:6px;opacity:.7">Fill in to adopt - we reply on 077 263 7424</p>

<form id="adoptForm">
<label>Full Name *<input type="text" id="aname" required placeholder="Your full name"></label>
<label>Your WhatsApp Number *<input type="tel" id="aphone" required placeholder="077..."></label>
<label>Email<input type="email" id="aemail" placeholder="optional"></label>
<label>Which Cat do you want to adopt? *<select id="acat" required><option value="">Select a cat</option><option>Luca - Resident</option><option>Chino - Resident</option><option>Lulu</option><option>Mimi</option><option>Flicker</option><option>Ollie</option><option>Eddie</option><option>Dudley</option><option>Luna</option><option>Theo</option><option>Any cat - advise me</option></select></label>
<label>Where do you live? (Area) *<input type="text" id="aarea" required placeholder="e.g. Durban North, Morningside"></label>
<label>Living Situation<select id="ahouse"><option>House with garden</option><option>Flat / Apartment</option><option>Shared House</option><option>Other</option></select></label>
<label>Do you have other pets?<input type="text" id="apets" placeholder="e.g. 1 dog, no cats"></label>
<label>Experience with cats *<select id="aexp" required><option>First time owner</option><option>Had cats before</option><option>Currently have cats</option></select></label>
<label>Why do you want to adopt this cat? *<textarea id="awhy" required placeholder="Tell us why you love this cat"></textarea></label>
<button class="submit" type="submit">📱 Submit Adoption Request - WhatsApp 077 263 7424</button>
</form>

<p style="font-size:11px;margin-top:12px;text-align:center;opacity:.6">Opens WhatsApp to 077 263 7424 with your details. Just press SEND.</p>
</div>
</div>
<script>
// Auto-fill cat from URL ?cat=Theo
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('cat')){document.getElementById('acat').value = urlParams.get('cat');}
document.getElementById('adoptForm').addEventListener('submit', function(e){
e.preventDefault();
let msg = `Hi MeanKat Cafe! 🐱 ADOPTION REQUEST%0A%0AName: ${document.getElementById('aname').value}%0APhone: ${document.getElementById('aphone').value}%0AEmail: ${document.getElementById('aemail').value}%0ACat: ${document.getElementById('acat').value}%0AArea: ${document.getElementById('aarea').value}%0ALiving: ${document.getElementById('ahouse').value}%0AOther Pets: ${document.getElementById('apets').value}%0AExperience: ${document.getElementById('aexp').value}%0AWhy: ${document.getElementById('awhy').value}`;
window.open(`https://wa.me/27772637424?text=${msg}`, '_blank');
});
</script>
</body>
  </html>
